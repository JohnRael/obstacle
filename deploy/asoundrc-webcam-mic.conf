# Optional ALSA convenience config, NOT required by obstacle.py.
#
# obstacle.py works around the webcam mic's stereo-only hardware itself
# (see StereoMicrophone in obstacle.py) and does not depend on this file.
#
# This just makes the webcam mic easier to use with other tools (arecord,
# future scripts) without having to match its exact native format (stereo,
# S16_LE, hw:2,0) by hand every time - ALSA's "plug" layer here handles
# format/channel/rate conversion automatically. It does NOT touch the
# existing playback default, so it cannot affect espeak-ng's speaker output.
#
# To install: append this block to ~/.asoundrc on the Pi (create the file
# if it doesn't exist), then e.g.:
#   arecord -D webcammic -f cd -d 5 test.wav
# will work without specifying -D hw:2,0 or matching its exact hw params.

pcm.webcammic {
    type plug
    slave.pcm "hw:2,0"
}
